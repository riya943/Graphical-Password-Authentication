{% extends "base.html" %}
{% block content %}
<div class="card auth-card">
    <h1>Reset Password</h1>
    <p class="muted">Enter your username. A reset link will be sent to the email saved on the account.</p>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required autocomplete="username">
        <button class="primary" type="submit">Send Reset Link</button>
    </form>
    <div class="auth-links"><a href="{{ url_for('login') }}">Back to Login</a></div>
</div>
{% endblock %}
