{% extends "base.html" %}
{% block content %}
<div class="card wide">
    <h1>Set New Passwords</h1>
    <p class="muted">Resetting both passwords for <strong>{{ username }}</strong>. This link is temporary.</p>
    <form method="POST" id="graphical-form" autocomplete="off">
        <label>New Normal Password</label>
        <div class="password-wrap">
            <input type="password" name="password" id="password" minlength="6" required autocomplete="new-password">
            <button type="button" class="eye-button" onclick="togglePassword('password', this)">Show</button>
        </div>
        <label>New Graphical Password</label>
        <input type="hidden" name="graphical_password" id="graphical_password">
        <div id="selected-box">Selected sequence: <span id="selected-sequence">None</span></div>
        <div class="image-grid">
            {% for key, name in images %}
            <button type="button"
                    class="image-card"
                    data-key="{{ key }}"
                    onclick="selectImage(this)">

                <img src="{{ url_for('static', filename='images/' ~ key ~ '.svg') }}"
                    alt="{{ name }} pattern">

            </button>
            {% endfor %}
        </div>
        <button class="primary" type="submit">Save New Passwords</button>
    </form>
</div>
<script src="{{ url_for('static', filename='js/graphical.js') }}"></script>
{% endblock %}
